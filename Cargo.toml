[package]
name = "redos-sentry"
version = "0.1.0"
edition = "2021"
authors = ["SMK Telkom Makassar Developer Team"]
description = "Static regex fuzzer and catastrophic backtracking (ReDoS) vulnerability analyzer"
license = "MIT"
keywords = ["regex", "redos", "security", "fuzzer", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex-syntax = "0.8"
colored = "2.1"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
